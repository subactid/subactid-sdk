name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancelled half way: an interrupted run leaves some packages published and some not.
  cancel-in-progress: false

jobs:
  # The whole of CI on the tagged commit, in jobs that hold nothing but a read token. An npm
  # version cannot be taken back, so nothing is published that has not built, typechecked and
  # passed its tests on this commit, on every Node the packages support.
  ci:
    # A fork that happens to carry a v* tag must not try to publish as @subactid.
    if: github.repository == 'subactid/subactid-sdk'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Builds and packs what will be published. This job runs the toolchain and every development
  # dependency, so it holds no identity that npm would accept: a compromised dependency here can
  # tamper with the tarballs it packs and nothing else, and the publish job checks what it is
  # handed before anything goes out.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      names: ${{ steps.packages.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag can be put on any commit, and the approval screen of the publish job does not show
      # whether that commit went through review. Only what is on main is released.
      - name: Refuse a tag that is not on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Tag is not on main::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from main. Only reviewed commits are released."
            exit 1
          fi

      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Not a release tag::'$tag' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $version from $tag"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a cache written by another workflow must not reach a release build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile

      - name: Every package must carry the tag's version, and the version must not be released
        id: packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The workspace decides what is published: everything not marked private, in dependency
          # order, so that @subactid/mcp goes out after the @subactid/server it depends on. A
          # package added later is released with the rest without this list being edited.
          pnpm list -r --depth -1 --json > "$RUNNER_TEMP/workspace.json"
          node - "$RUNNER_TEMP/workspace.json" > "$RUNNER_TEMP/publish.json" <<'EOF'
          const fs = require('node:fs');
          const all = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')).filter((p) => !p.private);
          const names = new Set(all.map((p) => p.name));
          const pkgs = new Map(
            all.map((p) => {
              const manifest = JSON.parse(fs.readFileSync(`${p.path}/package.json`, 'utf8'));
              const deps = Object.keys(manifest.dependencies ?? {}).filter((d) => names.has(d));
              return [p.name, { version: p.version, deps }];
            }),
          );
          const ordered = [];
          const visit = (name, trail) => {
            if (ordered.some((p) => p.name === name)) return;
            if (trail.includes(name)) throw new Error(`dependency cycle: ${[...trail, name].join(' -> ')}`);
            const pkg = pkgs.get(name);
            for (const dep of pkg.deps) visit(dep, [...trail, name]);
            const file = `${name.replace(/^@/, '').replace('/', '-')}-${pkg.version}.tgz`;
            ordered.push({ name, version: pkg.version, file, published: false });
          };
          for (const name of [...pkgs.keys()].sort()) visit(name, []);
          console.log(JSON.stringify(ordered, null, 2));
          EOF
          names=$(jq -r '.[] | "\(.name) \(.version)"' "$RUNNER_TEMP/publish.json")
          if [ -z "$names" ]; then
            echo "::error title=Nothing to publish::the workspace has no publishable package."
            exit 1
          fi

          # A package never goes out claiming a version that is not the one that was tagged.
          while read -r name version; do
            if [ "$version" != "$VERSION" ]; then
              echo "::error title=Version does not match the tag::$name is $version, the tag is $VERSION. Bump the packages, then tag."
              exit 1
            fi
          done <<< "$names"

          # A version is published once: npm will not replace one, so the run has to know which
          # are already up before it starts. All of them means this version is released already
          # and there is nothing to do. Some of them is a run that failed part way through, and
          # the rest still have to go out: the publish job skips what is marked here.
          total=0 already=0
          while read -r name version; do
            total=$((total + 1))
            if out=$(npm view "${name}@${version}" version 2>&1) && [ -n "$out" ]; then
              echo "${name}@${version} is already on npm"
              already=$((already + 1))
              jq --arg name "$name" '(.[] | select(.name == $name)).published = true' \
                "$RUNNER_TEMP/publish.json" > "$RUNNER_TEMP/publish.json.new"
              mv "$RUNNER_TEMP/publish.json.new" "$RUNNER_TEMP/publish.json"
              continue
            fi
            case "$out" in
              *E404*) echo "${name}@${version} is free" ;;
              *)
                echo "::error title=Registry did not answer::could not tell whether ${name}@${version} is published: $out"
                exit 1 ;;
            esac
          done <<< "$names"
          if [ "$already" -eq "$total" ]; then
            echo "::error title=Already published::every package is on npm at ${VERSION}. Cut a new version rather than replacing one."
            exit 1
          fi
          if [ "$already" -gt 0 ]; then
            echo "::warning title=Finishing a part-published release::${already} of ${total} packages are already on npm at ${VERSION}; the rest will be published."
          fi

          {
            echo "names<<NAMES"
            echo "$names"
            echo "NAMES"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm build

      - name: Pack the packages
        shell: bash
        run: |
          set -euo pipefail
          # Apache-2.0 asks that the licence and the NOTICE travel with the work, and npm only packs
          # files that sit beside the package. Copied at pack time rather than kept as three copies
          # of each.
          for dir in packages/*/; do cp LICENSE NOTICE "$dir"; done

          # pnpm writes the version being released in place of each "workspace:*" dependency, so
          # @subactid/mcp is packed depending on the @subactid/server packed beside it.
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          pnpm -r --filter './packages/*' exec pnpm pack --pack-destination "$out"
          cp "$RUNNER_TEMP/publish.json" "$out/"
          ls -1 "$out"

          # Every package the workspace says is published has its tarball, under the name the
          # publish job will look for.
          while read -r file; do
            if [ ! -f "$out/$file" ]; then
              echo "::error title=Tarball missing::pnpm pack did not produce $file."
              exit 1
            fi
          done < <(jq -r '.[].file' "$out/publish.json")

      # The tarballs cross to the publish job as an artifact of this run, which is the only thing
      # that job takes in.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarballs the build job packed, and nothing else runs here: no checkout, no
  # install, no dependency. This is the one job with an identity npm accepts, and it is handed
  # only what it needs. Node 24 ships an npm that supports trusted publishing (11.5.1 or later).
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishing waits for the environment's required reviewers, and npm accepts a publish only
    # from this workflow in this environment (the trusted publisher on each package).
    environment: npm-release
    permissions:
      id-token: write # npm trusted publishing and provenance, neither of which has a key to keep
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/pack

      # No token: npm exchanges this job's OIDC identity for a short-lived publish credential,
      # which only works for a package whose trusted publisher is this repository, release.yml
      # and the npm-release environment. The same identity signs the provenance attestation.
      - name: Check each tarball against the tag, then publish in dependency order
        shell: bash
        working-directory: ${{ runner.temp }}/pack
        run: |
          set -euo pipefail
          npm --version
          args=(--provenance --access public)
          # A prerelease goes out under its own dist-tag and never moves `latest`.
          if [ "$PRERELEASE" = true ]; then args+=(--tag next); fi

          while read -r name version file published; do
            # Each tarball says what it is. It must be the package the workspace listed, at the
            # tag's version, depending on the sibling packages at that same version.
            tar -xOf "$file" package/package.json > manifest.json
            node - "$name" "$VERSION" <<'EOF'
            const manifest = JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'));
            const [name, version] = process.argv.slice(2);
            const refuse = (why) => {
              console.error(`::error title=Tarball refused::${why}`);
              process.exit(1);
            };
            if (!name.startsWith('@subactid/')) refuse(`${name} is not an @subactid package`);
            if (manifest.name !== name) refuse(`${name}: the tarball is ${manifest.name}`);
            if (manifest.version !== version) refuse(`${name} is ${manifest.version}, the tag is ${version}`);
            for (const [dep, range] of Object.entries(manifest.dependencies ?? {})) {
              if (dep.startsWith('@subactid/') && range !== version) {
                refuse(`${name} depends on ${dep}@${range}, not on the ${version} published beside it`);
              }
            }
          EOF
            if [ "$published" = true ]; then
              echo "${name}@${version} is already on npm and is left alone"
              continue
            fi
            npm publish "./${file}" "${args[@]}" < /dev/null
            echo "published ${name}@${version}"
          done < <(jq -r '.[] | "\(.name) \(.version) \(.file) \(.published)"' publish.json)

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog is the commits since the previous tag, so the run needs both.
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release notes
        shell: bash
        env:
          NAMES: ${{ needs.build.outputs.names }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..${tag}"
            since="Changes since ${previous}"
          else
            range="$tag"
            since="Changes"
          fi
          subjects=$(git log --no-merges --pretty=format:'%s' "$range" | grep -v '^$' || true)

          # One section per conventional-commit type, with the type stripped off the subject.
          section() {
            local heading="$1" types="$2" body
            body=$(printf '%s\n' "$subjects" | sed -n -E "s/^(${types})(\([^)]*\))?!?: /- /p" || true)
            [ -n "$body" ] || return 0
            printf '\n### %s\n\n%s\n' "$heading" "$body"
          }

          {
            printf '## %s\n' "$since"
            # A breaking change is called out rather than left to be found in a list of features.
            breaking=$(printf '%s\n' "$subjects" | sed -n -E 's/^[a-z]+(\([^)]*\))?!: /- /p' || true)
            if [ -n "$breaking" ]; then printf '\n### Breaking\n\n%s\n' "$breaking"; fi
            section 'Added' 'feat'
            section 'Fixed' 'fix'
            section 'Documentation' 'docs'
            # Everything that is not one of the three above keeps its subject and loses its type,
            # so a chore or a test still appears rather than being dropped on the floor.
            other=$(printf '%s\n' "$subjects" \
              | grep -vE '^(feat|fix|docs)(\([^)]*\))?!?: ' | grep -v '^$' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^/- /' || true)
            if [ -n "$other" ]; then printf '\n### Everything else\n\n%s\n' "$other"; fi

            printf '\n## Published\n\n'
            while read -r name version; do printf -- '- `%s@%s`\n' "$name" "$version"; done <<< "$NAMES"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        shell: bash
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          # Fails rather than replacing a release that is already there.
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
